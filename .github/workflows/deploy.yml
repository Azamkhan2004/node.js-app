name: This is a node.js application

on:
  push:
     branches:
         -main

jobs:
   deploy:
        runs-on: ubuntu_latest

   
        steps:
            -name: checkout code
             uses: actions/checkout@v4
            -name: Deploy via SSH
             uses: appleboy/ssh-actions@v1.0.3
             with:
                host: ${{ secrets.ssh_host}}
                username: root
                key: ${{ secrets.ssh_key}}
                script:
                     cd /home/ubuntu/node.js-app/.github/workflows
                     git pull
                     docker compose -d --build

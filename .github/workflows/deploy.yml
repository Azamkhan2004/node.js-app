name: Deploy Node.js App

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ssh_host }}
          username: ubuntu
          key: ${{ secrets.ssh_key }}
          script: |
            cd /home/ubuntu/node.js-app
            git pull origin main
            docker compose up -d --build
